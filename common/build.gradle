architectury {
    common rootProject.enabled_platforms.split(',')
}
repositories {
    maven { url 'https://maven.quiltmc.org/repository/release/' }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    flatDir {
        dir "../../../MC_ModUtilities/mc_${minecraft_version}_MC_ModUtilities/common/build/libs"
    }
    maven { url 'https://jitpack.io' }

    //mavenLocal()

}
dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc<=1.21.11
    //implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc>=26.1

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc<=1.21.11
    //implementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc>=26.1


    modCompileOnly("com.github.KROIA.MC_ModUtilities:modutilities-common:$rootProject.modutilities_version") // mc<=1.21.11
    //compileOnly("com.github.KROIA.MC_ModUtilities:modutilities-common:$rootProject.modutilities_version:dev") // mc>=26.1 (common jar carries the dev classifier on 26.1)
    //modApi("net.kroia:modutilities-common:1.0.0")

    //implementation("net.kroia:modutilities-common:1.0.0")

    compileOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-common-api:${jei_version}")

    // Create: Numismatics integration (Task #34, v2.0.5)
    // compileOnly — no runtime dependency; adapter only activates when Numismatics is present.
    // Numismatics classes are accessed via reflection, so we don't need the actual dependency
    // at compile time. The adapter is class-guarded and only loads when Platform.isModLoaded("numismatics").
    // compileOnly("maven.modrinth:numismatics:${numismatics_version}")

    // LuckPerms API: compileOnly, never bundled. Only the dev-build LuckPerms tests (testing/) reference it,
    // in nested classes loaded only when LuckPerms is present (Task #108).
    compileOnly "net.luckperms:api:${rootProject.luckperms_api_version}"

    implementation('org.xerial:sqlite-jdbc:3.46.0.0'){
        exclude group: "org.slf4j"
    }

    // Offline unit tests (Task #130): ModUtilities' OfflineTests runs the TestSuites with needsGame() == false as JUnit tests.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

// `gradlew :common:test` runs the TestSuites that need no game (TestSuite.needsGame() == false), see OfflineTestsTest.
// ModUtilities is modCompileOnly: the tests compile against it via compileOnly and run with Loom's remapped jar
// (modCompileClasspathMainMapped is Loom-internal and created in afterEvaluate; Loom 1.7 has no modTest* configurations).
configurations.testCompileOnly.extendsFrom configurations.compileOnly
afterEvaluate { configurations.testRuntimeClasspath.extendsFrom configurations.modCompileClasspathMainMapped } // Loom creates it late // mc<=1.21.11
//configurations.testRuntimeClasspath.extendsFrom configurations.compileOnly // mc>=26.1 (no remapping: ModUtilities is plain compileOnly)
// Release mode (enable_dev_features=false) keeps testing/** out of main (root build.gradle), so the test source set
// compiles it itself; the include pattern also covers src/test/java, whose classes therefore live in the testing package.
if (!(rootProject.findProperty('enable_dev_features') ?: 'false').toBoolean()) {
    sourceSets.test.java {
        srcDir 'src/main/java'
        include 'net/kroia/banksystem/testing/**'
    }
    // A ModUtilities release jar has no testing package: skip the offline tests instead of failing the release build.
    def muHasTesting = {
        sourceSets.test.compileClasspath.files.any { f -> f.name.endsWith('.jar') &&
                new java.util.zip.ZipFile(f).withCloseable { it.getEntry('net/kroia/modutilities/testing/OfflineTests.class') != null } }
    }.memoize()
    compileTestJava.onlyIf('ModUtilities jar has its testing package (dev build)') { muHasTesting() }
    test.onlyIf('ModUtilities jar has its testing package (dev build)') { muHasTesting() }
    // Test detection loads every class in the test output, now including the suites; the LuckPerms suites' nested
    // classes need the compileOnly LuckPerms API. Only scan the JUnit classes (suites are named *Tests).
    test.include '**/*Test.class'
}

test {
    useJUnitPlatform()
    workingDir = temporaryDir // Minecraft's log4j config writes logs/latest.log into the working directory
    // test-topic selection (ModUtilities tools/autotest/README.md): gradlew :common:test -Dmodutilities.tests.exclude=<keys>
    ['modutilities.tests.exclude', 'modutilities.tests.include', 'modutilities.tests.offline'].each { systemProperty it, System.getProperty(it, '') }
}
