# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Dev-only code (unit tests, test commands) is compiled only when true. Keep false in commits;
# set it to true locally for dev builds (those need a ModUtilities jar built with -Penable_dev_features=true).
enable_dev_features=false

# Mod properties
mod_version = 1.21.9-2.2.0
maven_group = net.kroia
archives_name = banksystem
enabled_platforms = fabric,neoforge,quilt

# Minecraft properties
minecraft_version = 1.21.9
yarn_mappings = 1.21.9+build.1
mapping_version=2024.06.16


# Dependencies
architectury_api_version = 18.0.5
fabric_loader_version = 0.17.3
fabric_api_version = 0.134.1+1.21.9
neoforge_version = 21.9.16-beta
yarn_mappings_patch_neoforge_version = 1.21+build.4
quilt_loader_version = 0.28.0-beta.4
jei_version=25.0.1.4
# JEI version family (1.21.2/1.21.3 use 1.21.1; 1.21.6 has no JEI build and uses 1.21.5).
